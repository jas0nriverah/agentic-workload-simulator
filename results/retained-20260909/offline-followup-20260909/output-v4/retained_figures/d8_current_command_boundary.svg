<text x="24" y="28" class="title">D8 retained confirmation: command and native service walls</text><text x="24" y="45" class="sub">Retained confirmation fixture (descriptive only; excluded from fitting); 40 semantic actions, 60 runtime commands, and 40 physical native requests.</text><line x1="260" y1="350" x2="850" y2="350" stroke="#e5e7eb"/><text x="260" y="367" class="axis">0 s</text><text x="850" y="367" text-anchor="end" class="axis">85 s</text><text x="248" y="107" text-anchor="end" class="axis">semantic agent actions</text><rect x="260" y="92" width="124.0" height="22" fill="#2f6f9f"/><text x="392.0" y="108" class="value">18.492s</text><text x="248" y="147" text-anchor="end" class="axis">auxiliary runtime commands</text><rect x="260" y="132" width="94.8" height="22" fill="#6c8ebf"/><text x="362.8" y="148" class="value">14.143s</text><text x="248" y="187" text-anchor="end" class="axis">tool-execution union</text><rect x="260" y="172" width="218.8" height="22" fill="#314a67"/><text x="486.8" y="188" class="value">32.634s</text><text x="248" y="227" text-anchor="end" class="axis">native prefill service</text><rect x="260" y="212" width="22.8" height="22" fill="#d98e3f"/><text x="290.8" y="228" class="value">3.407s</text><text x="248" y="267" text-anchor="end" class="axis">native decode service</text><rect x="260" y="252" width="500.1" height="22" fill="#c15d3e"/><text x="768.1" y="268" class="value">74.575s</text><text x="248" y="307" text-anchor="end" class="axis">native E2E service</text><rect x="260" y="292" width="523.9" height="22" fill="#7e5aa6"/><text x="791.9" y="308" class="value">78.120s</text><text x="24" y="414" class="note">Ratios use native prefill+decode service (77.983 s): semantic/native=0.237124; union/native=0.418482. Bars are side-by-side, never stacked across overlapping lifecycle phases.</text></svg>
